# Mosquitto settings for testing on your LAPTOP (Windows / Mac / Linux).
# Start it with:   mosquitto -c mosquitto_laptop.conf -v
#
# Mosquitto 2.x only listens to the laptop itself unless told otherwise.
# These two lines let the watch (another device on the same Wi-Fi) connect.
listener 1883
allow_anonymous true

# Keep QoS 1 messages if the broker restarts.
persistence true
persistence_file mosquitto_activity.db

# ---- Optional: require a password instead of allowing anyone on the network ----
# 1. Create the file:  mosquitto_passwd -c passwords.txt kenneth
# 2. Replace "allow_anonymous true" above with the two lines below:
# allow_anonymous false
# password_file passwords.txt
