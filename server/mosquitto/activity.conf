# Mosquitto settings for the RASPBERRY PI.
# Copy to /etc/mosquitto/conf.d/activity.conf, then:  sudo systemctl restart mosquitto
# (The Pi's main mosquitto.conf already turns persistence on, so it is not repeated here.)
listener 1883
allow_anonymous true

# ---- Optional: require a password ----
# sudo mosquitto_passwd -c /etc/mosquitto/passwords kenneth
# then replace "allow_anonymous true" with:
# allow_anonymous false
# password_file /etc/mosquitto/passwords
